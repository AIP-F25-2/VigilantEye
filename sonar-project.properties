# SonarQube Configuration for VigilantEye

# Project identification
sonar.projectKey=vigilanteye
sonar.organization=your-org
sonar.projectName=VigilantEye AI Video Intelligence System
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=**/*test*.py,**/*test*.js,**/*test*.jsx,**/*spec*.py,**/*spec*.js,**/*spec*.jsx

# Language-specific settings
sonar.python.version=3.11
sonar.javascript.version=18

# Coverage and test reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.xunit.reportPaths=backend/test-results.xml
sonar.javascript.xunit.reportPaths=frontend/test-results.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/migrations/**,**/build/**,**/dist/**
sonar.test.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**

# Quality gates
sonar.qualitygate.wait=true

# Security settings
sonar.security.hotspots.reviewed=true

# Code analysis settings
sonar.python.pylint.reportPaths=backend/pylint-report.txt
sonar.javascript.eslint.reportPaths=frontend/eslint-report.json

# Duplication settings
sonar.cpd.python.minimumtokens=100
sonar.cpd.javascript.minimumtokens=100

# Analysis parameters
sonar.analysis.mode=publish
sonar.verbose=true
