# SonarQube Project Configuration
sonar.projectKey=vigilanteye
sonar.projectName=VigilentEye - AI Surveillance System
sonar.projectVersion=1.0.0
sonar.organization=your-organization

# Source Code Paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.sourceEncoding=UTF-8

# Language Specific Settings
# Python (Backend)
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml

# JavaScript/TypeScript (Frontend)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Exclusions
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/venv/**,**/env/**,**/dist/**,**/build/**,**/*.pyc,**/migrations/**,**/tests/**,**/__tests__/**,**/test/**,**/coverage/**,**/htmlcov/**,**/.pytest_cache/**,**/models_cache/**,**/storage/**
sonar.test.exclusions=**/tests/**,**/__tests__/**,**/test/**
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/migrations/**,**/config/**,**/constants.py

# Quality Gates
sonar.qualitygate.wait=true

# Coverage Thresholds
sonar.coverage.minimum=80.0

# Code Duplication
sonar.cpd.exclusions=**/tests/**,**/__tests__/**

# Technical Debt
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# Issue Severity
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

# Analysis Parameters
sonar.scm.provider=git
sonar.scm.disabled=false
sonar.links.homepage=https://github.com/your-org/vigilanteye
sonar.links.ci=https://github.com/your-org/vigilanteye/actions
sonar.links.issue=https://github.com/your-org/vigilanteye/issues
