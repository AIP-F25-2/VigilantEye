version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: vigilanteye-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vigilanteye}
      MYSQL_USER: ${MYSQL_USER:-vigilanteye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-vigilanteye}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilanteye-backend-prod
    environment:
      # Database
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-vigilanteye}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vigilanteye}
      
      # Local Cache Configuration
      CACHE_DIR: /app/storage/local_cache
      CACHE_MAX_MEMORY_ITEMS: 1000
      CACHE_DEFAULT_TTL: 3600
      CACHE_CLEANUP_INTERVAL: 300
      
      # Application
      APP_NAME: VigilantEye
      APP_ENV: production
      DEBUG: "false"
      
      # AI Configuration
      AI_DEVICE: ${AI_DEVICE:-cpu}
      MODEL_CACHE_PATH: /app/storage/model_cache
      MODEL_CACHE_ENABLED: "true"
      
      # Storage
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      VECTOR_DB_PATH: /app/storage/vector_db
      
      # Security
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_BOT_TOKEN: 8345256867:AAFMasgNavOAstsxPdnOazZfHNRHoNJTbQ0
      TELEGRAM_WEBHOOK_SECRET: supersecret
      TELEGRAM_ESCALATION_CHANNEL: -4672336726
      
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vigilanteye-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilanteye-frontend-prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vigilanteye-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local

networks:
  vigilanteye-network:
    driver: bridge
