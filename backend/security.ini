# Security Configuration for VigilantEye

# Bandit configuration for Python security scanning
[bandit]
exclude_dirs = ["tests", "venv", "migrations"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for tests

# Safety configuration for dependency vulnerability scanning
[safety]
# Check for known security vulnerabilities in dependencies
output_format = json
output_file = safety-report.json

# Trivy configuration for container security scanning
[trivy]
# Scan for vulnerabilities in Docker images
severity = HIGH,CRITICAL
format = sarif
output = trivy-results.sarif
