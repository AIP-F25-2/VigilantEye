name: SonarCloud Scan

on:
  pull_request:
    branches: [ "dev" ]     # runs whenever you open/update a PR targeting dev
  push:
    branches: [ "dev" ]     # also scan when dev itself gets new commits
  workflow_dispatch:         # allow manual run from Actions tab

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AIP-F25-2_VigilantEye
            -Dsonar.organization=AIP-F25-2
            -Dsonar.python.version=3
