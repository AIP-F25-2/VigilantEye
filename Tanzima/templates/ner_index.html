<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive NER System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.8;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .upload-section.dragover {
            border-color: #667eea;
            background: #e8f0fe;
        }
        
        .file-input {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .text-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .text-input {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1em;
            resize: vertical;
            font-family: inherit;
        }
        
        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .results {
            margin-top: 30px;
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .image-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .result-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .entities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .entity-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        
        .entity-type {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .entity-text {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .entity-confidence {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Comprehensive NER System</h1>
            <p>Detect entities in images and text using OpenCV, spaCy, and OCR</p>
        </div>
        
        <div class="content">
            <!-- Image Upload Section -->
            <div class="upload-section" id="uploadSection">
                <h3>📸 Upload Image for Analysis</h3>
                <p>Drag and drop an image here or click to select</p>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    Choose Image
                </button>
                <p style="margin-top: 15px; color: #6c757d; font-size: 0.9em;">
                    Supported formats: PNG, JPG, JPEG, GIF, BMP, TIFF (Max 16MB)
                </p>
            </div>
            
            <!-- Text Analysis Section -->
            <div class="text-section">
                <h3>📝 Analyze Text</h3>
                <textarea id="textInput" class="text-input" placeholder="Enter text to analyze for named entities..."></textarea>
                <button class="upload-btn" onclick="analyzeText()">Analyze Text</button>
            </div>
            
            <!-- Loading Indicator -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing your content...</p>
            </div>
            
            <!-- Results Section -->
            <div class="results" id="results">
                <h3>🎯 Analysis Results</h3>
                
                <!-- Statistics -->
                <div class="stats" id="stats">
                    <!-- Stats will be populated by JavaScript -->
                </div>
                
                <!-- Image Results -->
                <div class="image-container" id="imageContainer">
                    <!-- Image will be displayed here -->
                </div>
                
                <!-- Entities -->
                <div class="entities-grid" id="entitiesGrid">
                    <!-- Entities will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const textInput = document.getElementById('textInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const imageContainer = document.getElementById('imageContainer');
        const entitiesGrid = document.getElementById('entitiesGrid');
        const stats = document.getElementById('stats');

        // File upload handling
        fileInput.addEventListener('change', handleFileUpload);
        
        // Drag and drop handling
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileUpload();
            }
        });

        function handleFileUpload() {
            const file = fileInput.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            showLoading();
            
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.success) {
                    displayResults(data);
                } else {
                    showError(data.error);
                }
            })
            .catch(error => {
                hideLoading();
                showError('Upload failed: ' + error.message);
            });
        }

        function analyzeText() {
            const text = textInput.value.trim();
            if (!text) {
                showError('Please enter some text to analyze');
                return;
            }
            
            showLoading();
            
            fetch('/analyze_text', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.success) {
                    displayTextResults(data);
                } else {
                    showError(data.error);
                }
            })
            .catch(error => {
                hideLoading();
                showError('Text analysis failed: ' + error.message);
            });
        }

        function displayResults(data) {
            // Clear previous results
            clearResults();
            
            // Display image
            if (data.image_data) {
                imageContainer.innerHTML = `
                    <img src="data:image/jpeg;base64,${data.image_data}" 
                         alt="Analysis Result" class="result-image">
                `;
            }
            
            // Display statistics
            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.total_entities}</div>
                    <div class="stat-label">Total Entities</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.entities.length}</div>
                    <div class="stat-label">Visual Entities</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.text_entities.length}</div>
                    <div class="stat-label">Text Entities</div>
                </div>
            `;
            
            // Display entities
            displayEntities([...data.entities, ...data.text_entities]);
            
            // Show extracted text if available
            if (data.extracted_text) {
                const textDiv = document.createElement('div');
                textDiv.className = 'entity-card';
                textDiv.innerHTML = `
                    <div class="entity-type">📄 Extracted Text</div>
                    <div class="entity-text">${data.extracted_text}</div>
                `;
                entitiesGrid.appendChild(textDiv);
            }
            
            results.classList.add('show');
        }

        function displayTextResults(data) {
            // Clear previous results
            clearResults();
            
            // Display statistics
            stats.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.total_entities}</div>
                    <div class="stat-label">Text Entities</div>
                </div>
            `;
            
            // Display entities
            displayEntities(data.entities);
            
            // Show original text
            const textDiv = document.createElement('div');
            textDiv.className = 'entity-card';
            textDiv.innerHTML = `
                <div class="entity-type">📄 Original Text</div>
                <div class="entity-text">${data.text}</div>
            `;
            entitiesGrid.appendChild(textDiv);
            
            results.classList.add('show');
        }

        function displayEntities(entities) {
            entities.forEach(entity => {
                const entityDiv = document.createElement('div');
                entityDiv.className = 'entity-card';
                
                const confidence = entity.confidence ? ` (${(entity.confidence * 100).toFixed(1)}%)` : '';
                
                entityDiv.innerHTML = `
                    <div class="entity-type">${getEntityIcon(entity.type)} ${entity.type}</div>
                    <div class="entity-text">${entity.text}</div>
                    <div class="entity-confidence">${entity.subtype || 'Entity'}${confidence}</div>
                `;
                
                entitiesGrid.appendChild(entityDiv);
            });
        }

        function getEntityIcon(type) {
            const icons = {
                'PERSON': '👤',
                'ORG': '🏢',
                'GPE': '🌍',
                'DATE': '📅',
                'MONEY': '💰',
                'PERCENT': '📊',
                'CARDINAL': '🔢',
                'ORDINAL': '🔢',
                'LOC': '📍',
                'EVENT': '🎉',
                'FAC': '🏛️',
                'LANGUAGE': '🗣️',
                'LAW': '⚖️',
                'NORP': '👥',
                'PRODUCT': '📦',
                'WORK_OF_ART': '🎨',
                'BODY_PART': '👁️',
                'EXPRESSION': '😊',
                'TEXT_REGION': '📝',
                'OBJECT': '📦'
            };
            return icons[type] || '🏷️';
        }

        function showLoading() {
            loading.style.display = 'block';
            results.classList.remove('show');
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function clearResults() {
            imageContainer.innerHTML = '';
            entitiesGrid.innerHTML = '';
            stats.innerHTML = '';
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            
            // Remove existing error messages
            const existingErrors = document.querySelectorAll('.error');
            existingErrors.forEach(error => error.remove());
            
            // Add new error message
            results.parentNode.insertBefore(errorDiv, results);
        }
    </script>
</body>
</html>
