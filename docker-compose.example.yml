# Docker Compose file for Flask API with MySQL and phpMyAdmin
# Copy this file to docker-compose.yml and set your passwords in a .env file

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flaskapi}
      MYSQL_USER: ${MYSQL_USER:-flaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-flaskuser}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-flaskapi}}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: ${FLASK_ENV:-development}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      ALT_CHANNELS_FILE: alternate_channels.json
      ESCALATE_AFTER_SECONDS: ${ESCALATE_AFTER_SECONDS:-900}
      CLOSE_AFTER_SECONDS: ${CLOSE_AFTER_SECONDS:-3600}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        echo 'Starting application...' &&
        echo 'Running migrations...' &&
        flask db upgrade &&
        echo 'Starting Gunicorn...' &&
        gunicorn --bind 0.0.0.0:8000 --workers 1 --log-level debug run:app
      "

volumes:
  mysql_data:

