version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vigilanteye-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vigilanteye
      MYSQL_USER: vigilanteye_user
      MYSQL_PASSWORD: vigilanteye_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  redis:
    image: redis:7-alpine
    container_name: vigilanteye-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: vigilanteye-chromadb
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import sys, urllib.request; urllib.request.urlopen(\'http://localhost:8000/api/v1/heartbeat\')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  ollama:
    image: ollama/ollama:latest
    container_name: vigilanteye-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_HOST=0.0.0.0
    networks:
      - vigilanteye-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilanteye-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/vigilanteye
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      OLLAMA_HOST: http://ollama:11434
      # Load other variables from .env file
      env_file:
        - ./backend/.env
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - backend_models:/app/models_cache
      - backend_logs:/app/logs
    command: gunicorn -w 4 -b 0.0.0.0:5000 --timeout 300 --reload 'src.app:create_app()'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vigilanteye-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilanteye-celery-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same as backend service
      env_file:
        - ./backend/.env
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/vigilanteye
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - backend_models:/app/models_cache
      - backend_logs:/app/logs
    command: celery -A src.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vigilanteye-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilanteye-celery-beat
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same as backend service
      env_file:
        - ./backend/.env
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/vigilanteye
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      OLLAMA_HOST: http://ollama:11434
      ENABLE_BEAT: "true"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - backend_models:/app/models_cache
      - backend_logs:/app/logs
    command: celery -A src.celery_app beat --loglevel=info
    networks:
      - vigilanteye-network

  nginx:
    image: nginx:alpine
    container_name: vigilanteye-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - vigilanteye-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  ollama_data:
    driver: local
  backend_storage:
    driver: local
  backend_models:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  vigilanteye-network:
    driver: bridge

