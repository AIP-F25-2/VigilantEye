version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vigilanteye-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vigilanteye
      MYSQL_USER: vigilanteye_user
      MYSQL_PASSWORD: vigilanteye_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  redis:
    image: redis:7-alpine
    container_name: vigilanteye-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: vigilanteye-chromadb
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import sys, urllib.request; urllib.request.urlopen(\'http://localhost:8000/api/v1/heartbeat\')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  ollama:
    image: ollama/ollama:latest
    container_name: vigilanteye-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_HOST=0.0.0.0
    networks:
      - vigilanteye-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  ollama_data:
    driver: local

networks:
  vigilanteye-network:
    driver: bridge

