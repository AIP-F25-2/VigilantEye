version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vigilanteye-postgres
    environment:
      POSTGRES_DB: vigilanteye
      POSTGRES_USER: vigilanteye
      POSTGRES_PASSWORD: vigilanteye123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilanteye -d vigilanteye"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilanteye-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilanteye-backend
    environment:
      # Database
      DATABASE_URL: postgresql://vigilanteye:vigilanteye123@postgres:5432/vigilanteye
      
      # Application
      APP_NAME: VigilantEye
      APP_ENV: development
      DEBUG: "true"
      
      # AI Configuration
      AI_DEVICE: cpu
      MODEL_CACHE_PATH: /app/storage/model_cache
      MODEL_CACHE_ENABLED: "true"
      
      # Storage
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      VECTOR_DB_PATH: /app/storage/vector_db
      
      # Security
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET_KEY: your-jwt-secret-key-change-in-production
      
      # External APIs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: 8345256867:AAFMasgNavOAstsxPdnOazZfHNRHoNJTbQ0
      TELEGRAM_WEBHOOK_SECRET: supersecret
      TELEGRAM_ESCALATION_CHANNEL: -4672336726
      
      # Cleanup Configuration
      CLEANUP_ENABLED: "true"
      CLEANUP_INTERVAL_HOURS: "24"
      PERSON_DATA_RETENTION_DAYS: "30"
      EMBEDDING_DATA_RETENTION_DAYS: "90"
      MEDIA_RETENTION_DAYS: "60"
      
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vigilanteye-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python scripts/setup_database.py &&
        echo 'Starting application...' &&
        python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
      "

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilanteye-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vigilanteye-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local

networks:
  vigilanteye-network:
    driver: bridge
