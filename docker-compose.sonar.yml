version: '3.8'

services:
  sonarqube:
    image: sonarqube:9.9-community
    container_name: vigilanteye-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - vigilanteye-network

  sonar-db:
    image: postgres:13
    container_name: vigilanteye-sonar-db
    environment:
      - POSTGRES_DB=sonar
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - vigilanteye-network

  # SonarQube Scanner for CI/CD
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: vigilanteye-sonar-scanner
    volumes:
      - .:/usr/src
    working_dir: /usr/src
    command: sonar-scanner
    depends_on:
      - sonarqube
    networks:
      - vigilanteye-network

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:

networks:
  vigilanteye-network:
    driver: bridge
