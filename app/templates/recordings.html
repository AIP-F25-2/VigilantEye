{% extends "base.html" %}

{% block title %}Recordings - VIGILANTEye{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-6 fw-bold">
                <i class="bi bi-film me-2"></i>Recordings
            </h1>
            <p class="text-muted">View and manage your surveillance recordings.</p>
        </div>
    </div>

    <!-- Recordings List -->
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-list me-2"></i>Recording List</h5>
                </div>
                <div class="card-body">
                    <div id="recordings-container">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3">Loading recordings...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadRecordings();
});

function loadRecordings() {
    fetch('/api/v2/recordings')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('recordings-container');
            
            if (data.status === 'success' && data.data.length > 0) {
                let html = '<div class="row g-3">';
                
                data.data.forEach(recording => {
                    const statusClass = recording.status === 'completed' ? 'success' : 
                                      recording.status === 'recording' ? 'primary' : 
                                      recording.status === 'failed' ? 'danger' : 'secondary';
                    const statusIcon = recording.status === 'completed' ? 'check-circle' : 
                                     recording.status === 'recording' ? 'record-circle' : 
                                     recording.status === 'failed' ? 'x-circle' : 'pause-circle';
                    
                    const duration = recording.duration_seconds ? 
                        Math.round(recording.duration_seconds / 60) + ' min' : 'N/A';
                    
                    html += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="card-title mb-0">Recording #${recording.id}</h6>
                                        <span class="badge bg-${statusClass}">
                                            <i class="bi bi-${statusIcon} me-1"></i>${recording.status}
                                        </span>
                                    </div>
                                    <p class="card-text small text-muted">
                                        <i class="bi bi-clock me-1"></i>Duration: ${duration}
                                        <br>
                                        <i class="bi bi-camera me-1"></i>FPS: ${recording.fps || 'N/A'}
                                        <br>
                                        <i class="bi bi-calendar me-1"></i>Started: ${new Date(recording.started_at).toLocaleString()}
                                        ${recording.ended_at ? '<br><i class="bi bi-calendar-check me-1"></i>Ended: ' + new Date(recording.ended_at).toLocaleString() : ''}
                                    </p>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-sm btn-outline-primary" onclick="viewRecording(${recording.id})">
                                            <i class="bi bi-eye me-1"></i>View
                                        </button>
                                        <button class="btn btn-sm btn-outline-success" onclick="downloadRecording(${recording.id})">
                                            <i class="bi bi-download me-1"></i>Download
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            } else {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-film" style="font-size: 3rem;"></i>
                        <p class="mt-3">No recordings found</p>
                        <p class="small">Start recording to see your surveillance footage here</p>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Error loading recordings:', error);
            document.getElementById('recordings-container').innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Error loading recordings. Please try again.
                </div>
            `;
        });
}

function viewRecording(recordingId) {
    // For now, just show an alert
    alert(`View recording ${recordingId} - Feature coming soon!`);
}

function downloadRecording(recordingId) {
    // For now, just show an alert
    alert(`Download recording ${recordingId} - Feature coming soon!`);
}
</script>
{% endblock %}
