# Azure Kubernetes Service deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilanteye-backend
  labels:
    app: vigilanteye-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vigilanteye-backend
  template:
    metadata:
      labels:
        app: vigilanteye-backend
    spec:
      containers:
      - name: backend
        image: vigilanteye.azurecr.io/vigilanteye-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vigilanteye-secrets
              key: database-url
        - name: CACHE_DIR
          value: "/app/storage/local_cache"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: vigilanteye-secrets
              key: secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: vigilanteye-secrets
              key: jwt-secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vigilanteye-secrets
              key: openai-api-key
        - name: TELEGRAM_BOT_TOKEN
          value: "8345256867:AAFMasgNavOAstsxPdnOazZfHNRHoNJTbQ0"
        - name: TELEGRAM_WEBHOOK_SECRET
          value: "supersecret"
        - name: TELEGRAM_ESCALATION_CHANNEL
          value: "-4672336726"
        - name: APP_ENV
          value: "production"
        - name: AI_DEVICE
          value: "cpu"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/health/liveness
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/readiness
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: vigilanteye-storage-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: vigilanteye-logs-pvc
      imagePullSecrets:
      - name: vigilanteye-acr-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigilanteye-frontend
  labels:
    app: vigilanteye-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigilanteye-frontend
  template:
    metadata:
      labels:
        app: vigilanteye-frontend
    spec:
      containers:
      - name: frontend
        image: vigilanteye.azurecr.io/vigilanteye-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "0.25"
          limits:
            memory: "512Mi"
            cpu: "0.5"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      imagePullSecrets:
      - name: vigilanteye-acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: vigilanteye-backend-service
spec:
  selector:
    app: vigilanteye-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vigilanteye-frontend-service
spec:
  selector:
    app: vigilanteye-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigilanteye-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - vigilanteye.yourdomain.com
    secretName: vigilanteye-tls
  rules:
  - host: vigilanteye.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vigilanteye-backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vigilanteye-frontend-service
            port:
              number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigilanteye-storage-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: azurefile-csi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vigilanteye-logs-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: azurefile-csi
